inherit_from: ../../shared_config/.rubocop.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
  # gRPC generated files
    - 'lib/openfeature/flagd/provider/flagd/**/*.rb'

# keyword_init: true is not redundant: it maps a positional Hash to fields and rejects positional args
Style/RedundantStructKeywordInit:
  Enabled: false
